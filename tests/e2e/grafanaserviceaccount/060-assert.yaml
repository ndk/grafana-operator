apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: service-accounts
  labels:
    test: service-accounts
status:
  (conditions[?type == 'ServiceAccountsSynchronized']):
  - message: service accounts reconciled
    reason: ApplySuccessful
    status: 'True'
    type: ServiceAccountsSynchronized
  serviceAccounts:
    - name: grafana-service-account-sa2
      role: Viewer
      (serviceAccountId > `2` && serviceAccountId < `5`): true
      specId: grafana-sa2
      tokens:
        - name: tokena
          secretName: ''
          (tokenId > `1` && tokenId < `6`): true
        - name: tokenb
          secretName: ''
          (tokenId > `1` && tokenId < `6`): true
    - name: grafana-service-account-sa3
      role: Admin
      isDisabled: true
      (serviceAccountId > `2` && serviceAccountId < `5`): true
      specId: grafana-sa3
      tokens:
        - name: tokenc
          secretName: ''
          (tokenId > `5` && tokenId < `8`): true
          (time_between(expires, time_utc(time_add($NOW, '24h55m')), time_utc(time_add($NOW, '25h05m')))): true
        - name: tokend
          secretName: ''
          (tokenId > `5` && tokenId < `8`): true
          (time_between(expires, time_utc(time_add($NOW, '28h55m')), time_utc(time_add($NOW, '29h05m')))): true
